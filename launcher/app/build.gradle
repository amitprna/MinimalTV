plugins {
    id "com.android.application"
}

android {
    namespace "io.github.amitprna.minimaltv"
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "io.github.amitprna.minimaltv"
        minSdk 30
        targetSdk 34
        versionCode 22
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            // Personal sideload build: the debug key is enough to install and update.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
